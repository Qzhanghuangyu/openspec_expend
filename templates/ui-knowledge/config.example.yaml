version: 1
scope: project
# Android View / Jetpack Compose。以下为检索接入配置示例；只读校验 CLI 使用固定知识目录，
# 不执行自定义 provider，也不会根据本文件建立索引。

knowledge:
  sourceOfTruth: markdown
  componentPaths:
    - .falla/ui-knowledge/components
  screenPatternPaths:
    - .falla/ui-knowledge/screen-patterns

semantic:
  # 当前索引实现仅允许 unconfigured 或测试专用 fake；真实 Provider 后续显式接入。
  provider: unconfigured
  model: unconfigured
  dimensions: null
  indexPath: .falla/ui-knowledge/.index
  topK: 8

graph:
  provider: codegraph
  projectRoot: .
  maxCandidates: 5
  maxFilesPerCandidate: 6

retrieval:
  projectOnly: true
  requireVerifiedForDirectReuse: true
  allowDraftAsReference: true
  rejectInvalid: true

writeback:
  autoGenerate: false
  requireExplicitTask: true
  requireReviewerForVerified: true
