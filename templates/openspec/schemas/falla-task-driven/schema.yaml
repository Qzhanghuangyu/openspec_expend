name: falla-task-driven
version: 1
description: Falla 可独立实施的子 change 工作流
artifacts:
  - id: tasks
    generates: tasks.md
    description: 当前子 change 的具体实施与验证任务
    template: tasks.md
    instruction: |
      只记录当前子 change 的实际任务、输入、允许编辑范围、完成条件和前置依赖。任务应能在一次独立
      实施上下文内完成。先核对父 design 的项目规则审计、当前边界、depends-on 和根页面/XML 责任；适用
      required 必须落实为当前子任务的完成检查，再添加最小实施、
      自动验证及必要的 `[人工]` 项。新增/实质修改的符号逐项审计注释。
      不得复制父任务或其他子 change 的进度，
      不保存执行/验证模式。
    requires: []

  - id: comate
    generates: comate.md
    description: 子 change 的唯一协作状态台账
    template: comate.md
    instruction: |
      保存 format-version: 2、validation-mode、human-review、owner、status、depends-on 和 handoff。子 change 不保存
      execution-mode；反向 blocks 由 depends-on 推导，不落盘。handoff 是滚动检查点，done 时必须完整
      填写已完成、注释审计、验证证据、生命周期结论、安全结论和遗留风险；hybrid/human 还必须填写
      人工验证反馈。
    requires:
      - tasks

apply:
  requires: [comate]
  tracks: tasks.md
  instruction: |
    只执行当前子 change 的 tasks，并遵守已加载的 Soul 与 Apply 阶段规则。验证模式和协作状态只从
    当前 comate 读取；父 design 提供共享实现基线和可跨会话复用的设计源证据。复用本地资源前核对文件
    和哈希；资源缺失或设计已知变化时只补读 design 中已授权的精确节点。一次只推进一个 ready task；
    完成条件、最小验证和注释审计满足后，才可勾选对应 checkbox 并更新结构化 handoff，
    禁止批量补勾。未完成或验证失败时不得勾选；
    规划冲突时返回父 change 的 propose 阶段修正。
