name: falla-task-driven
version: 1
description: Falla 可独立实施的子 change 工作流
artifacts:
  - id: tasks
    generates: tasks.md
    description: 当前子 change 的具体实施与验证任务
    template: tasks.md
    instruction: |
      只记录当前子 change 的实际任务、输入、允许编辑范围、完成条件和前置依赖。任务应能在一次独立
      实施上下文内完成。先核对父 design 的项目规则审计、当前边界、depends-on 和根页面/XML 责任；适用
      required 必须落实为当前子任务的完成检查，再添加最小实施与可验证的完成条件；不默认新增单测。
      明确模块类型与实际 variant；普通实施任务做轻量检查并注明待集成验证。相关实施完成后
      安排一个集成任务：可运行页面或入口交付须构建实际应用 APK，其成功覆盖资源打包与编译；
      无可安装应用时按改动选择模块构建。有现成测试基础的易回归纯状态逻辑安排少量定向测试。
      页面退出先静态核对释放与 NPE 风险；
      需证明释放行为时做运行时检查，Agent 无法实测则保留 `[人工]` 任务。
      Figma UI 复现引用父 design 的关键节点文本规格，安排运行时节点核对与独立 `[人工]` 视觉
      验收任务，指定代表性页面/状态、设备配置和文字反馈格式；核对按宽适配是否生效、实际内容
      高度与 Insets，不把父 design 的画布高度或项目配置高度当运行时上限；不复制父设计全文。
      不预排完整状态矩阵或全量检查，静态核对不能代替运行时证据或视觉结论。
      新增/实质修改的符号逐项审计注释。
      不得复制父任务或其他子 change 的进度，
      不保存执行/验证模式。
    requires: []

  - id: comate
    generates: comate.md
    description: 子 change 的唯一协作状态台账
    template: comate.md
    instruction: |
      保存 format-version: 2、validation-mode、human-review、owner、status、depends-on 和 handoff。子 change 不保存
      execution-mode；反向 blocks 由 depends-on 推导，不落盘。handoff 是滚动检查点，done 时必须完整
      填写已完成、注释审计、验证证据、生命周期结论、安全结论和遗留风险；实施任务和集成验证
      结果分别记录，构建不代替设备运行；静态生命周期核对与运行时
      退出检查分开写。hybrid 无 `[人工]` 任务时 human-review 可为 not-required；有人工任务或 human
      模式时须由人工确认 passed 并填写反馈。
    requires:
      - tasks

apply:
  requires: [comate]
  tracks: tasks.md
  instruction: |
    只执行当前子 change 的 tasks，并遵守已加载的 Soul 与 Apply 阶段规则。验证模式和协作状态只从
    当前 comate 读取；父 design 提供共享实现基线和可跨会话复用的设计源证据。复用本地资源前核对文件
    和哈希；资源缺失或设计已知变化时只补读 design 中已授权的精确节点。一次只推进一个 ready task；
    实施任务的待集成结果须指向后续集成任务；当前任务的完成条件、最小验证和注释审计满足后，
    才可勾选对应 checkbox 并更新结构化 handoff，
    禁止批量补勾。未完成或验证失败时不得勾选；已勾选任务的完成条件被后续失败推翻时恢复未完成
    并纠正 handoff；已 done 的 change 先按协作规则协调父子状态和下游依赖，归档后不原地重开，
    复验后才重勾；
    规划冲突时返回父 change 的 propose 阶段修正。
