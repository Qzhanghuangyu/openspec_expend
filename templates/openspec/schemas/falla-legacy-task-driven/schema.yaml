name: falla-legacy-task-driven
version: 1
description: 兼容迁移旧 Falla 子 change
artifacts:
  - id: tasks
    generates: tasks.md
    description: 旧子 change 任务清单
    template: tasks.md
    instruction: 保留原任务、checkbox 和依赖顺序。
    requires: []

  - id: comate
    generates: comate.md
    description: 旧子 change 协作台账
    template: comate.md
    instruction: 保留 owner、status、depends-on、blocks 和 handoff，不覆盖已有值。
    requires:
      - tasks

apply:
  requires: [comate]
  tracks: tasks.md
  instruction: 继续旧子 change 时遵守原父子依赖和交接状态。
