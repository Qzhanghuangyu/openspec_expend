name: falla-spec-driven
version: 1
description: Falla 父需求工作流：preflight、规格、设计、任务与协作台账
artifacts:
  - id: preflight
    generates: preflight.md
    description: PRD 实现状态、主干可执行性与兼容性分析
    template: preflight.md
    instruction: |
      执行前必须读取 .falla/skill-spec/[分析必读]preflight.md 及其触发的参考规则。
      记录实现状态、源码证据、问题类型/级别、阻断范围和待确认项，不包含方案或代码修改。
      按阶段规则填写顶部 falla-preflight/ reviewed/ blockers 准入台账；产物存在不代表阻塞项已解决。
      在线 PRD 的 prd-source.md、授权设计的 design-source.md 使用同目录模板，按阶段规则生成；
      它们是父 change 的取证工作文件，不新增 artifact DAG 节点。
    requires: []
  - id: proposal
    generates: proposal.md
    description: 说明变更动机、范围和业务能力
    template: proposal.md
    instruction: |
      执行前必须读取 .falla/skill-spec/[架构必读]propose.md 及其触发的参考规则。
      基于 preflight 记录动机、范围、影响和用户可观察、可测试的业务能力，不以实现层代替能力。
      无规格级行为变化时设置 skip_specs: true。
    requires:
      - preflight
  - id: specs
    generates: specs/**/*.md
    description: 用户可观察行为的 delta specs
    template: spec.md
    instruction: |
      执行前必须读取 .falla/skill-spec/[架构必读]propose.md 及其触发的参考规则。
      为 proposal 中的能力变化创建 delta spec。使用 ADDED、MODIFIED、REMOVED、RENAMED Requirements；
      每项 Requirement 至少包含一个四级标题 Scenario，并使用 WHEN/THEN。修改前读取完整原需求。
      skip_specs: true 时不得创建 specs 文件。
    requires:
      - proposal
  - id: design
    generates: design.md
    description: 技术方案、实现基线和人工校准计划
    template: design.md
    instruction: |
      执行前必须读取 .falla/skill-spec/[架构必读]propose.md 及其触发的参考规则。
      记录技术决策、页面结构、项目规则审计、required/preferred/reference-only 实现基线、
      具体类/API 与 task/子 change 绑定、注释契约、生命周期、安全、交付验证、风险及开放问题。
      采用模板的 XML 层级、关键节点文本规格和选型表；设计取证台账按 design-tools 保存在父
      design-source.md，本 artifact 只保存可读的授权概要、实施结论、资源齐备状态和未决项。
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: 当前父 change 的具体实施与验证任务
    template: tasks.md
    instruction: |
      执行前必须读取 .falla/skill-spec/[架构必读]propose.md 及其触发的参考规则。
      使用 checkbox 记录当前 change的任务，每项包含输入、交付物、允许编辑范围、完成条件和前置编号。
      任务和前置依赖均使用章节.序号编号，依赖须引用现存任务的精确编号；格式见 Propose 任务拆解规则。
      保留 tasks 模板中的 falla-tasks-format 格式标记，按 Propose 规则填写机器可校验的依赖字段。
      按 Propose 的任务拆解规则生成，design 的适用 required 约束关联到负责的任务。
      parallel 父 tasks 只记录协调里程碑与子 change 引用。
      验证安排遵循 android-quality，模式与协作状态遵循 coordination；本 artifact 不保存模式。
    requires:
      - specs
      - design
  - id: comate
    generates: comate.md
    description: 父 change 的唯一协作状态台账
    template: comate.md
    instruction: |
      执行前必须读取 .falla/skill-spec/references/coordination.md。
      保存 format-version: 2、execution-mode、validation-mode、human-review、human-task-results、owner、status、depends-on 和 handoff。
      parallel 父记录保存整体决策，不复制子 handoff；Propose 保留默认待认领身份，后续显式 claim --coordinator。
      保留 baseline: unrecorded / baseline-review: none；按 coordination 的基线协议记录快照，旧进度不得直接刷新。
      human-task-results 仅保存编号和人工结果，不从勾选推断通过；人工反馈可选。
      使用模板的结构化 handoff；字段取值、人工验收、完成及回退门禁以 coordination 为准。
    requires:
      - tasks
apply:
  requires:
    - comate
  tracks: tasks.md
  instruction: |
    执行前必须读取 .falla/skill-spec/[Must Read]soul.md、.falla/skill-spec/[模块选读]apply.md，
    并加载阶段规则触发的参考文件。single 实施当前 change 的 tasks；parallel 父仅执行协调里程碑，
    显式认领父协调职责，子代码实施仍须单独认领；父状态更新与交接按 coordination，引用父 design，
    官方 all_done 不证明完成证据仍适用；先检查当前实施基线，变化返回复核，不自动清空任务。
    模式和协作状态从当前 comate 读取；任务循环、验收、检查点和回退遵循 Apply 阶段规则。
